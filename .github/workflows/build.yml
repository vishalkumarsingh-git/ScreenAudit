name: Build ScreenAudit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile ScreenAudit
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /O2 /W4 /EHsc /MT /DUNICODE /D_UNICODE src\main.cpp /Fe:ScreenAudit.exe /link /SUBSYSTEM:WINDOWS gdiplus.lib user32.lib gdi32.lib shell32.lib psapi.lib wtsapi32.lib dwmapi.lib comdlg32.lib comctl32.lib advapi32.lib UIAutomationCore.lib ole32.lib oleaut32.lib
          if ($LASTEXITCODE -ne 0) { throw "ScreenAudit compilation failed." }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          iscc installer/ScreenAudit.iss
          if ($LASTEXITCODE -ne 0) { throw "ScreenAudit installer build failed." }

      - name: Upload executable and installer
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAudit-windows-x64
          path: |
            ScreenAudit.exe
            dist/ScreenAudit-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
